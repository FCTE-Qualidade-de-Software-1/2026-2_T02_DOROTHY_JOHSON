name: Coleta PSM/CID

# Snapshot diário do kanban e dos PRs (docs/gestao/plano-medicao.md).
# 02:00 UTC = 23:00 em Brasília (UTC-3) do dia anterior.
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: psm-coleta
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # PSM_TOKEN: PAT classic com escopo read:project, usado só para leitura.
      - name: Coletar dados
        env:
          GH_TOKEN: ${{ secrets.PSM_TOKEN }}
        run: scripts/psm/coletar.sh

      # O push usa o GITHUB_TOKEN do checkout; commits feitos com ele não disparam outros workflows.
      - name: Versionar CSVs
        run: |
          git add data/psm
          if git diff --cached --quiet; then
            echo "Sem alterações nos dados."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(psm): coleta diária $(TZ=America/Sao_Paulo date +%F)"
          git push
